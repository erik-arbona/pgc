{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <h1>{{ title }}</h1>
  <table>
    <thead>
      <tr><th>{% translate "Nome" %}</th><th>{% translate "Valor" %}</th><th></th></tr>
    </thead>
    <tbody>
      {% for item in object_list %}
      <tr>
        <td>{{ item.name }}</td><td>{{ item.value }}</td>
        <td><a href="{% url 'core:parameter_update' item.pk %}">{% translate "Editar" %}</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
